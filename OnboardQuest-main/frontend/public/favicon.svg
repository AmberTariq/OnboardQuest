<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Pixel star coin — arcade blue bg, pixel yellow star -->
  <rect width="32" height="32" fill="#1a6fbf"/>
  <!-- star body: top point -->
  <rect x="14" y="2"  width="4" height="4" fill="#f5d000"/>
  <!-- star wide row -->
  <rect x="10" y="6"  width="12" height="4" fill="#f5d000"/>
  <!-- star full width -->
  <rect x="4"  y="10" width="24" height="4" fill="#f5d000"/>
  <!-- star mid -->
  <rect x="10" y="14" width="12" height="4" fill="#f5d000"/>
  <!-- star split lower -->
  <rect x="6"  y="18" width="8"  height="4" fill="#f5d000"/>
  <rect x="18" y="18" width="8"  height="4" fill="#f5d000"/>
  <!-- star bottom points -->
  <rect x="4"  y="22" width="6"  height="4" fill="#f5d000"/>
  <rect x="22" y="22" width="6"  height="4" fill="#f5d000"/>
  <!-- amber border highlight rows -->
  <rect x="14" y="2"  width="4" height="1" fill="#e8a800"/>
  <rect x="4"  y="10" width="24" height="1" fill="#e8a800"/>
</svg>
